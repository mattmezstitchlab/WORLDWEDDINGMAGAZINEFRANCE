<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Wedding Magazine — Édition France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090D;
    --bg-2:#0d0f16;
    --panel:rgba(14,16,22,0.86);
    --panel-solid:#0e1016;
    --border:rgba(232,228,220,0.09);
    --border-strong:rgba(232,228,220,0.16);
    --text:#E8E4DC;
    --text-2:#a8a49c;
    --muted:#7a766f;
    --dim:#4a4844;
    --gold:#D4A855;
    --gold-soft:#e8c98a;
    --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    --mono:'JetBrains Mono', 'SF Mono', Menlo, monospace;
    --c-image:#C77D6D;
    --c-video:#4A6FA5;
    --c-audio:#7B6BA8;
    --c-music:#8E7CC3;
    --c-place:#5F8A6E;
    --c-person:#D4A855;
    --c-pro:#B85555;
    --c-event:#D6704E;
    --c-doc:#8B8B8B;
    --c-relation:#7EC8E3;
    --c-validated:#6BBF7B;
    --c-confirm:#E0C548;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(232,228,220,0.14);border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(232,228,220,0.24);}

  /* ------------ CANVAS ------------ */
  #canvas-wrap{position:fixed;inset:0;z-index:1;}
  #canvas-wrap canvas{display:block;width:100%;height:100%;}

  /* ------------ HEADER ------------ */
  header{
    position:fixed;top:0;left:0;right:0;height:62px;z-index:20;
    display:flex;align-items:center;gap:24px;padding:0 22px;
    background:linear-gradient(180deg, rgba(8,9,13,0.96) 0%, rgba(8,9,13,0.72) 70%, rgba(8,9,13,0) 100%);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    pointer-events:none;
  }
  header > *{pointer-events:auto;}
  .brand{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,#D4A855 0%,#8B6F47 100%);
    display:grid;place-items:center;
    font-family:var(--serif);font-weight:900;font-size:17px;color:#0a0c10;
    box-shadow:0 0 24px rgba(212,168,85,0.28);
  }
  .brand-title{
    font-family:var(--serif);font-weight:700;font-size:13.5px;letter-spacing:0.03em;
    line-height:1.15;
  }
  .brand-sub{
    font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);
    margin-top:2px;font-weight:500;
  }
  .brand-sub .demo{
    color:#9C7BB8;font-family:var(--mono);letter-spacing:0.1em;
  }

  nav.views{
    display:flex;gap:2px;margin-left:auto;
    background:rgba(18,20,26,0.6);border:1px solid var(--border);border-radius:6px;
    padding:3px;
  }
  nav.views button{
    padding:7px 13px;border-radius:4px;font-size:10.5px;font-weight:500;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);
    transition:color .2s, background .2s;
    white-space:nowrap;
  }
  nav.views button:hover{color:var(--text-2);}
  nav.views button.active{
    color:#0a0c10;background:var(--gold);
    box-shadow:0 0 16px rgba(212,168,85,0.25);
  }
  .stats{display:flex;gap:20px;flex-shrink:0;}
  .stats > div{display:flex;flex-direction:column;align-items:flex-end;}
  .stats strong{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--gold-soft);line-height:1;}
  .stats span{font-size:8.5px;text-transform:uppercase;letter-spacing:0.2em;color:var(--muted);margin-top:3px;}

  /* ------------ INSPECTOR ------------ */
  #inspector{
    position:fixed;top:78px;right:22px;bottom:22px;width:360px;z-index:15;
    background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);border-radius:10px;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,0.55);
    transition:transform .4s cubic-bezier(.2,.9,.3,1), opacity .3s;
  }
  #inspector.hidden{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none;}
  .insp-head{
    padding:16px 18px;border-bottom:1px solid var(--border);
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  .insp-head .kicker{
    font-size:9px;letter-spacing:0.24em;text-transform:uppercase;color:var(--muted);
    margin-bottom:5px;font-weight:500;
  }
  .insp-head h2{
    font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.15;
    letter-spacing:-0.01em;
  }
  .insp-body{padding:16px 18px 22px;overflow-y:auto;flex:1;}

  .badge{
    display:inline-block;font-family:var(--mono);font-size:8.5px;
    letter-spacing:0.14em;text-transform:uppercase;padding:3px 7px;border-radius:2px;
    background:rgba(156,123,184,0.14);color:#b8a3d4;border:1px solid rgba(156,123,184,0.3);
  }
  .badge.gold{background:rgba(212,168,85,0.12);color:var(--gold-soft);border-color:rgba(212,168,85,0.3);}
  .badge.green{background:rgba(107,191,123,0.12);color:#9dd4a8;border-color:rgba(107,191,123,0.3);}

  .insp-meta{
    display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;
    margin:14px 0 16px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  }
  .insp-meta > div{display:flex;flex-direction:column;}
  .insp-meta .lbl{font-size:8.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .insp-meta .val{font-family:var(--serif);font-size:13px;color:var(--text);}
  .insp-meta .val.mono{font-family:var(--mono);font-size:11px;}

  .insp-lede{
    font-family:var(--serif);font-size:14px;line-height:1.55;font-style:italic;
    color:var(--text-2);margin-bottom:16px;
    padding-left:12px;border-left:2px solid var(--gold);
  }
  .insp-para{
    font-size:12.5px;line-height:1.7;color:var(--text-2);margin-bottom:11px;
  }
  .insp-para:first-letter{
    font-family:var(--serif);font-size:32px;font-weight:700;float:left;
    line-height:.85;padding:4px 8px 0 0;color:var(--gold-soft);
  }
  .section-label{
    font-size:9px;letter-spacing:0.24em;text-transform:uppercase;color:var(--muted);
    margin:20px 0 10px;font-weight:600;
  }
  .hour-list{display:grid;grid-template-columns:1fr;gap:1px;margin-top:4px;}
  .hour-row{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;
    cursor:pointer;transition:background .15s;border-left:2px solid transparent;
  }
  .hour-row:hover{background:rgba(232,228,220,0.04);}
  .hour-row.active{background:rgba(212,168,85,0.1);border-left-color:var(--gold);}
  .hour-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .hour-time{font-family:var(--mono);font-size:10px;color:var(--muted);width:38px;flex-shrink:0;}
  .hour-title{font-size:11.5px;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hour-row.active .hour-title{color:var(--gold-soft);}

  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:14px;margin:3px 4px 3px 0;
    font-size:10.5px;background:rgba(232,228,220,0.05);border:1px solid var(--border);
    color:var(--text-2);
  }
  .chip .dot{width:5px;height:5px;border-radius:50%;}

  .rel-list{display:flex;flex-direction:column;gap:6px;}
  .rel-item{
    display:flex;align-items:center;gap:9px;padding:8px 10px;
    background:rgba(232,228,220,0.03);border:1px solid var(--border);border-radius:5px;
    font-size:11px;
  }
  .rel-item .from{color:var(--muted);font-size:10px;font-family:var(--mono);}
  .rel-item .arrow{color:var(--gold);font-size:11px;}
  .rel-item .to{color:var(--text-2);}

  /* ------------ LEGEND ------------ */
  #legend{
    position:fixed;left:22px;bottom:22px;z-index:15;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:8px;padding:12px 14px;
    max-width:320px;
    transition:opacity .3s;
  }
  #legend.hidden{opacity:0;pointer-events:none;}
  .legend-title{
    font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);
    margin-bottom:9px;font-weight:600;
  }
  .legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text-2);}
  .legend-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

  /* ------------ OVERLAY VIEWS ------------ */
  #overlay{
    position:fixed;inset:0;z-index:12;display:none;
    background:radial-gradient(ellipse at 50% 40%, #0d1018 0%, #06070b 70%);
    padding:82px 26px 26px;
    overflow-y:auto;
  }
  #overlay.active{display:block;}
  #overlay.with-inspector{padding-right:400px;}

  /* MAP */
  .map-wrap{display:grid;grid-template-columns:1fr 1fr;gap:32px;height:100%;align-items:start;}
  .map-panel{position:relative;background:rgba(14,16,22,0.5);border:1px solid var(--border);border-radius:10px;padding:22px;overflow:hidden;}
  .map-panel svg{width:100%;height:auto;display:block;max-height:64vh;}
  .map-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-0.01em;}
  .map-sub{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
  .city-dot{cursor:pointer;transition:r .2s, opacity .2s;}
  .city-dot:hover{r:9;}
  .city-hit{cursor:pointer;fill:transparent;}
  .city-label{font-family:var(--serif);font-size:10.5px;fill:var(--text-2);pointer-events:none;}

  /* TIMELINE */
  .tm-wrap{padding:10px 0;}
  .tm-head{margin-bottom:26px;}
  .tm-head h2{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-0.02em;}
  .tm-head p{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-top:6px;}
  .tm-grid{display:grid;grid-template-columns:repeat(24, minmax(72px,1fr));gap:8px;overflow-x:auto;padding-bottom:12px;}
  .tm-hour{
    background:rgba(14,16,22,0.6);border:1px solid var(--border);border-radius:6px;
    padding:12px 10px;min-height:230px;cursor:pointer;transition:all .2s;
    display:flex;flex-direction:column;gap:8px;
  }
  .tm-hour:hover{border-color:var(--border-strong);transform:translateY(-2px);}
  .tm-hour.active{border-color:var(--gold);background:rgba(212,168,85,0.06);}
  .tm-time{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .tm-dot{width:10px;height:10px;border-radius:50%;}
  .tm-title{font-family:var(--serif);font-size:12.5px;line-height:1.3;color:var(--text);}
  .tm-scene{font-size:10.5px;line-height:1.5;color:var(--muted);}

  /* RELATIONS */
  .rel-wrap{display:grid;grid-template-columns:1fr;gap:24px;}
  .rel-head h2{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-0.02em;}
  .rel-head p{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-top:6px;}
  .rel-diagram{background:rgba(14,16,22,0.5);border:1px solid var(--border);border-radius:10px;padding:24px;}
  .rel-node text{font-family:var(--sans);font-size:10px;fill:var(--text-2);}
  .rel-node circle{transition:all .2s;cursor:pointer;}
  .rel-node circle:hover{stroke-width:3;}

  /* MAGAZINE */
  .mag-wrap{max-width:1180px;margin:0 auto;}
  .mag-spread{
    display:grid;grid-template-columns:1fr 1fr;gap:0;
    background:#f4efe6;color:#1a1816;
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
    border-radius:2px;overflow:hidden;
    aspect-ratio:1.55/1;
  }
  .mag-page{padding:44px 46px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .mag-page.right{border-left:1px solid rgba(26,24,22,0.08);}
  .mag-kicker{font-size:9.5px;letter-spacing:0.3em;text-transform:uppercase;color:#8a7d68;margin-bottom:16px;font-weight:600;}
  .mag-title{font-family:var(--serif);font-size:42px;font-weight:900;line-height:1.02;letter-spacing:-0.025em;color:#171512;margin-bottom:14px;}
  .mag-sub{font-family:var(--serif);font-size:16px;font-style:italic;color:#5a5145;margin-bottom:22px;line-height:1.4;}
  .mag-hero{
    flex:1;min-height:0;border-radius:1px;
    position:relative;overflow:hidden;
    background-size:cover;background-position:center;
  }
  .mag-hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(10,12,18,0.05) 0%, rgba(10,12,18,0.55) 100%);
  }
  .mag-hero-label{
    position:absolute;bottom:16px;left:18px;right:18px;
    font-family:var(--serif);font-size:17px;font-style:italic;color:#f4efe6;z-index:2;
    line-height:1.3;
  }
  .mag-hero-num{
    position:absolute;top:16px;left:18px;z-index:2;
    font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:rgba(244,239,230,0.85);
  }
  .mag-body{font-size:12.5px;line-height:1.75;color:#3a342c;font-family:Georgia,serif;}
  .mag-body p{margin-bottom:13px;}
  .mag-body p:first-of-type::first-letter{
    font-family:var(--serif);font-size:52px;font-weight:900;float:left;
    line-height:.82;padding:6px 10px 0 0;color:#b8912f;
  }
  .mag-caption{
    margin-top:auto;padding-top:16px;border-top:1px solid rgba(26,24,22,0.1);
    font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:#8a7d68;
    display:flex;justify-content:space-between;
  }
  .mag-quote{
    font-family:var(--serif);font-size:19px;font-style:italic;line-height:1.35;
    color:#5a5145;padding:16px 0 16px 22px;border-left:3px solid #b8912f;margin-bottom:18px;
  }

  /* ------------ TOOLTIP ------------ */
  #tooltip{
    position:fixed;z-index:30;pointer-events:none;
    background:rgba(10,12,16,0.92);border:1px solid var(--border-strong);
    border-radius:6px;padding:8px 12px;font-size:11px;
    opacity:0;transition:opacity .15s;
    backdrop-filter:blur(8px);
    max-width:260px;
  }
  #tooltip.show{opacity:1;}
  #tooltip .tt-time{font-family:var(--mono);font-size:9.5px;color:var(--gold);letter-spacing:0.1em;}
  #tooltip .tt-title{font-family:var(--serif);font-size:12.5px;margin-top:2px;line-height:1.3;}
  #tooltip .tt-city{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:0.06em;}

  /* ------------ LOADING ------------ */
  #loading{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:grid;place-items:center;
    transition:opacity .7s;
  }
  #loading.hide{opacity:0;pointer-events:none;}
  .load-mark{
    font-family:var(--serif);font-weight:900;font-size:44px;
    letter-spacing:0.1em;color:var(--gold);
    animation:pulse 2s ease-in-out infinite;
  }
  .load-sub{
    margin-top:12px;font-size:9.5px;letter-spacing:0.34em;text-transform:uppercase;color:var(--muted);
    text-align:center;
  }
  @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}

  /* ------------ RESPONSIVE ------------ */
  @media (max-width: 1100px){
    #inspector{width:320px;}
    .mag-spread{grid-template-columns:1fr;aspect-ratio:auto;}
    .mag-page.right{border-left:none;border-top:1px solid rgba(26,24,22,0.08);}
    .map-wrap{grid-template-columns:1fr;}
    #overlay.with-inspector{padding-right:26px;}
  }
  @media (max-width: 760px){
    header{gap:12px;padding:0 12px;}
    .brand-title{font-size:11.5px;}
    .brand-sub{font-size:8px;}
    nav.views button{padding:6px 9px;font-size:9px;letter-spacing:0.08em;}
    .stats{display:none;}
    #inspector{right:12px;left:12px;width:auto;top:72px;bottom:12px;}
    #legend{left:12px;bottom:12px;max-width:calc(100% - 24px);}
    .mag-title{font-size:30px;}
    .mag-page{padding:28px 24px;}
  }
</style>
</head>
<body>

<div id="loading">
  <div>
    <div class="load-mark">W</div>
    <div class="load-sub">World Wedding Magazine</div>
  </div>
</div>

<div id="canvas-wrap"></div>

<header>
  <div class="brand">
    <div class="brand-mark">W</div>
    <div>
      <div class="brand-title">WORLD WEDDING MAGAZINE</div>
      <div class="brand-sub">Édition France · 2025 · <span class="demo">DEMO</span></div>
    </div>
  </div>
  <nav class="views">
    <button data-view="3d" class="active">3D</button>
    <button data-view="grid">Grille</button>
    <button data-view="timeline">Timeline</button>
    <button data-view="map">Carte</button>
    <button data-view="relations">Relations</button>
    <button data-view="magazine">Magazine</button>
  </nav>
  <div class="stats">
    <div><strong>8 760</strong><span>positions</span></div>
    <div><strong>12</strong><span>mariages</span></div>
    <div><strong>365</strong><span>jours</span></div>
  </div>
</header>

<aside id="inspector">
  <div class="insp-head">
    <div>
      <div class="kicker" id="insp-kicker">Édition France · 2025</div>
      <h2 id="insp-title">World Wedding Magazine</h2>
    </div>
    <span class="badge" id="insp-badge">DEMO</span>
  </div>
  <div class="insp-body" id="insp-body"></div>
</aside>

<div id="legend">
  <div class="legend-title">Code DMC · Types de contenu</div>
  <div class="legend-grid" id="legend-grid"></div>
</div>

<div id="overlay"></div>

<div id="tooltip">
  <div class="tt-time" id="tt-time"></div>
  <div class="tt-title" id="tt-title"></div>
  <div class="tt-city" id="tt-city"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   DATA MODEL — SINGLE SOURCE OF TRUTH
   World → Edition → Year → Month → Day → Hour → Scene
   ========================================================= */

const DMC = {
  text:'#E8E4DC', image:'#C77D6D', video:'#4A6FA5', audio:'#7B6BA8',
  music:'#8E7CC3', place:'#5F8A6E', person:'#D4A855', professional:'#B85555',
  event:'#D6704E', document:'#8B8B8B', relation:'#7EC8E3',
  validated:'#6BBF7B', toConfirm:'#E0C548'
};

const TYPE_COLOR = {
  preparation: DMC.person,
  person:      DMC.person,
  professional:DMC.professional,
  event:       DMC.event,
  image:       DMC.image,
  place:       DMC.place,
  music:       DMC.music,
  relation:    DMC.relation,
  document:    DMC.document,
  video:       DMC.video
};

const MONTHS = ['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];
const DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];

const HOUR_TEMPLATES = [
  { type:'preparation', title:'La veille, à la nuit close', scene:'Chambre silencieuse. Les derniers préparatifs.' },
  { type:'preparation', title:'Le silence du lieu', scene:'Le domaine dort. Les premières lueurs.' },
  { type:'preparation', title:'Veille silencieuse', scene:'Les songes. La maison qui respire.' },

function buildScenes(w){
  return HOUR_TEMPLATES.map((t,h)=>{
    const isNight = h < 6 || h >= 22;
    const timeLabel = String(h).padStart(2,'0') + 'h00';
    return {
      id: `${w.id}-H${String(h).padStart(2,'0')}`,
      hour: h,
      time: timeLabel,
      type: t.type,
      su: `${w.city.toUpperCase()} · ${w.region.toUpperCase()} · ${timeLabel}`,
      title: t.title,
      subtitle: `${w.title} · ${MONTHS[w.month]} · DEMO`,
      chapo: t.scene,
      paragraphs: [
        `${w.city} ce jour-là respire autrement. La lumière de ${MONTHS[w.month].toLowerCase()} compose un décor qui n'appartient qu'à cette heure — ${h}h — entre le récit officiel et ce qui ne se photographie pas.`,
        `Les équipes sont en place. Le photographe cherche l'angle, le traiteur surveille la cuisine, le musicien règle son instrument. Rien n'est joué, tout est à écrire.`,
        `Cette séquence est une unité éditoriale complète : un lieu, un moment, des personnes, des professionnels, une intention. Le magazine la composera à sa façon — demain, dans une autre lumière.`
      ],
      place: {
        name: w.city, region: w.region, country:'France',
        lat: w.lat, lon: w.lon, type:'city',
        verificationStatus:'DEMO', source:'WW-DEMO'
      },
      professionals: [
        { type:'photographer', name:'Photographe', code:DMC.image },
        { type:'wedding-planner', name:'Wedding Planner', code:DMC.professional },
        { type:'caterer', name:'Traiteur', code:DMC.place },
        { type:'florist', name:'Fleuriste', code:DMC.person }
      ].map(p=>({...p, id: `${w.id}-${p.type}`, verificationStatus:'DEMO', source:'WW-DEMO'})),
      blocks: [
        { id: `${w.id}-H${h}-B1`, type:'text', content:t.scene, position:'main', size:'half', metadata:{}, source:'WW-DEMO', relations:[] },
        { id: `${w.id}-H${h}-B2`, type:'image', content:{ alt:`${w.city} — ${t.title}`, illustrative:true }, position:'side', size:'half', metadata:{ sourceType:'ILLUSTRATIVE' }, source:'PEXELS', relations:[] },

        { from:`${w.id}-H${h}`, to:`${w.city}`, kind:'scene-place' }
      ]
    };
  });
}

/* =========================================================
   GRID — 365 × 24 = 8 760 positions
   Layout: X = day of month · Z = month · Y = hour of day
   ========================================================= */

const DAY_W = 1.05;
const MONTH_D = 3.3;
const HOUR_H = 0.78;
const CENTER_MONTH = 5.5;

const emptyCells = [];
const contentCells = [];

WEDDINGS.forEach(w => {
  w.cellBase = null; // computed below
});

let totalEmpty = 0;
for (let m=0;m<12;m++) totalEmpty += DAYS_IN_MONTH[m]*24;

/* ---- Empty cells (implicit structure lattice) ---- */
{
  const geo = new THREE.BoxGeometry(0.20, 0.20, 0.20);
  const mat = new THREE.MeshStandardMaterial({
    color:0x2a3244, roughness:0.7, metalness:0.25,
    transparent:true, opacity:0.32, depthWrite:false
  });
  const mesh = new THREE.InstancedMesh(geo, mat, totalEmpty);
  mesh.frustumCulled = true;
  const dummy = new THREE.Object3D();
  let i = 0;
  for (let m=0;m<12;m++){
    const days = DAYS_IN_MONTH[m];
    for (let d=0;d<days;d++){
      for (let h=0;h<24;h++){
        dummy.position.set(
          (d-(days-1)/2)*DAY_W,
          0.5 + h*HOUR_H,
          (m-CENTER_MONTH)*MONTH_D
        );
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        i++;
      }
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

/* ---- Content cells (12 weddings × 24 hours = 288) ---- */
const contentMesh = (() => {
  const geo = new THREE.BoxGeometry(0.62, 0.62, 0.62);
  const mat = new THREE.MeshStandardMaterial({
    roughness:0.28, metalness:0.42, emissive:0x0a0a0a, emissiveIntensity:0.6
  });
  const mesh = new THREE.InstancedMesh(geo, mat, 12*24);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  let i = 0;

  WEDDINGS.forEach(w => {
    const days = DAYS_IN_MONTH[w.month];
    const xBase = (w.day-1-(days-1)/2)*DAY_W;
    const zBase = (w.month-CENTER_MONTH)*MONTH_D;
    w.cellBase = new THREE.Vector3(xBase, 0, zBase);

    for (let h=0;h<24;h++){
      dummy.position.set(xBase, 0.5 + h*HOUR_H, zBase);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      const c = TYPE_COLOR[HOUR_TEMPLATES[h].type] || DMC.text;
      mesh.setColorAt(i, col.set(c));
      contentCells.push({ wedding:w, hour:h, x:xBase, y:0.5+h*HOUR_H, z:zBase, instanceId:i });
      i++;
    }
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  return mesh;
})();

function makeLabelSprite(text, sub, color){
  const c = document.createElement('canvas');
  c.width = 640; c.height = 160;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,640,160);
  // main text
  ctx.font = '700 52px "Playfair Display", Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, 320, 62);
  // subtitle
  ctx.font = '500 22px Inter, sans-serif';
  ctx.fillStyle = 'rgba(232,228,220,0.7)';
  ctx.fillText(sub, 320, 112);
  // rule
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(240, 88); ctx.lineTo(400, 88);
  ctx.stroke();
  ctx.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, depthTest:false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(7.2, 1.8, 1);
  return sp;
}

const camTargetLook = new THREE.Vector3(0, 8, 0);

function easeInOut(t){
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
}

function setView(v){
  state.view = v;
  document.querySelectorAll('nav.views button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === v);
  });
  const overlay = document.getElementById('overlay');
  const inspector = document.getElementById('inspector');
  const legend = document.getElementById('legend');

  if (v === '3d' || v === 'grid' || v === 'timeline'){
    overlay.classList.remove('active');
    inspector.classList.remove('hidden');
    // Legend only in 3d
    legend.classList.toggle('hidden', v !== '3d');
    if (v === 'timeline'){
      // Show 2D timeline overlay but keep 3D behind (blurred)
      renderTimelineOverlay();
      overlay.classList.add('active');
      inspector.classList.remove('hidden');
      overlay.classList.remove('with-inspector');
    } else {
      // animate camera
      const p = VIEW_PRESETS[v];
      camFrom = { pos: camera.position.clone(), look: controls.target.clone() };
      camTargetPos.set(p.pos[0], p.pos[1], p.pos[2]);
      camTargetLook.set(p.look[0], p.look[1], p.look[2]);
      camT = 0;
    }
  } else {
    // Map / Relations / Magazine
    overlay.classList.add('active');
    overlay.classList.add('with-inspector');
    legend.classList.add('hidden');
    if (v === 'map') renderMapOverlay();
    if (v === 'relations') renderRelationsOverlay();
    if (v === 'magazine') renderMagazineOverlay();
  }
}

/* =========================================================
   INTERACTION — RAYCASTING
   ========================================================= */

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);
const tooltip = document.getElementById('tooltip');
const ttTime = document.getElementById('tt-time');
const ttTitle = document.getElementById('tt-title');
const ttCity = document.getElementById('tt-city');

let pointerDown = null;

renderer.domElement.addEventListener('pointermove', e => {
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  handleHover(e);
});

renderer.domElement.addEventListener('pointerdown', e => {
  pointerDown = { x:e.clientX, y:e.clientY };
});

renderer.domElement.addEventListener('pointerup', e => {
  if (!pointerDown) return;
  const dx = e.clientX - pointerDown.x;
  const dy = e.clientY - pointerDown.y;
  if (dx*dx + dy*dy < 36) handleClick(e);
  pointerDown = null;
});

renderer.domElement.addEventListener('pointerleave', () => {
  tooltip.classList.remove('show');
});

function handleHover(e){
  if (state.view !== '3d' && state.view !== 'grid') return;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(contentMesh);
  if (hits.length === 0){
    tooltip.classList.remove('show');
    state.hovered = null;
    document.body.style.cursor = '';
    return;
  }
  const id = hits[0].instanceId;
  const cell = contentCells[id];
  if (!cell) return;
  state.hovered = cell;
  const scene = cell.wedding.scenes[cell.hour];
  ttTime.textContent = `${cell.wedding.monthName} · ${scene.time} · DEMO`;
  ttTitle.textContent = scene.title;
  ttCity.textContent = `${cell.wedding.city} — ${cell.wedding.region}`;
  tooltip.style.left = (e.clientX + 16) + 'px';
  tooltip.style.top  = (e.clientY + 16) + 'px';
  tooltip.classList.add('show');
  document.body.style.cursor = 'pointer';
}

function handleClick(e){
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(contentMesh);
  if (hits.length === 0){
    // click on sprite label?
    const spriteHits = raycaster.intersectObjects(labelSprites);
    if (spriteHits.length){
      selectWedding(spriteHits[0].object.userData.wedding);
    }
    return;
  }
  const cell = contentCells[hits[0].instanceId];
  if (!cell) return;
  selectWedding(cell.wedding);
  selectHour(cell.hour);
}

function selectWedding(w){
  state.selectedWedding = w;
  if (state.selectedHour === null || state.selectedHour > 23){
    state.selectedHour = null;
  }
  updateSelectionVisuals();
  renderInspector();
  if (state.view === 'timeline') renderTimelineOverlay();
  if (state.view === 'map') renderMapOverlay();
  if (state.view === 'relations') renderRelationsOverlay();
  if (state.view === 'magazine') renderMagazineOverlay();
}

function selectHour(h){
  state.selectedHour = h;
  updateSelectionVisuals();
  renderInspector();
  if (state.view === 'timeline') renderTimelineOverlay();
  if (state.view === 'magazine') renderMagazineOverlay();
}

function updateSelectionVisuals(){
  const w = state.selectedWedding;
  const h = state.selectedHour;
  if (!w || h === null){
    selRing.visible = false;
    selHalo.visible = false;
    return;
  }
  const days = DAYS_IN_MONTH[w.month];
  const x = (w.day-1-(days-1)/2)*DAY_W;
  const z = (w.month-CENTER_MONTH)*MONTH_D;
  const y = 0.5 + h*HOUR_H;
  selRing.position.set(x, y + 0.45, z);
  selRing.rotation.x = -Math.PI/2;
  selHalo.position.set(x, y, z);
  selRing.visible = true;
  selHalo.visible = true;
}

  [-2.0,48.65],[-4.5,48.4],[-4.1,47.99],[-3.4,47.75],[-2.2,47.3],[-1.15,46.15],

function projectFrance(lon, lat, W, H){
  const lonMin=-5.8, lonMax=10.2, latMin=41.0, latMax=51.4;
  const x = ((lon - lonMin) / (lonMax - lonMin)) * W;
  const y = H - ((lat - latMin) / (latMax - latMin)) * H;
  return [x, y];
}

/* =========================================================
   ANIMATION LOOP
   ========================================================= */

const clock = new THREE.Clock();
let pulseT = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  pulseT += dt;

  // camera transition
  if (camFrom && camT < 1){
    camT = Math.min(1, camT + dt * 1.5);
    const e = easeInOut(camT);
    camera.position.lerpVectors(camFrom.pos, camTargetPos, e);
    controls.target.lerpVectors(camFrom.look, camTargetLook, e);
    if (camT >= 1) camFrom = null;
  }

  // pulse rings around wedding markers
  beamGroup.children.forEach(ch => {
    if (ch.userData.pulse){
      const r = ch.userData.pulse.ring;
      const s = 1 + Math.sin(pulseT * 1.6 + ch.position.z) * 0.15;
      r.scale.set(s, s, s);
      r.material.opacity = 0.25 + Math.sin(pulseT * 1.6 + ch.position.z) * 0.12;
    }
  });

  // selection halo pulse
  if (selHalo.visible){
    const s = 1 + Math.sin(pulseT * 3) * 0.12;
    selHalo.scale.set(s, s, s);
    selHalo.material.opacity = 0.09 + Math.sin(pulseT * 3) * 0.04;
  }
  if (selRing.visible){
    selRing.rotation.z += dt * 0.6;
  }

  // rim light subtle orbit
  rim.position.x = Math.sin(pulseT * 0.25) * 22;
  rim.position.z = Math.cos(pulseT * 0.25) * 22;

  controls.update();
  renderer.render(scene, camera);
}

animate();
